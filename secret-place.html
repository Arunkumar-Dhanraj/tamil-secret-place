<style>
  :root {

    --marigold-deep: #E39B0B;

  html { -webkit-text-size-adjust: 100%; }
  body {

    font-family: var(--body); font-size: 17px; line-height: 1.6;
    color: var(--ink);
    background-color: var(--marigold);
    background-image: radial-gradient(circle, rgba(34, 19, 56, .14) 1.6px, transparent 2.2px);

  body.dark {

  .btn {

  .hero { text-align: center; padding: 0 0 18px; }

  .name-row { display: flex; align-items: center; gap: 10px; }
  .name-row .num { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--jasmine); font-weight: 700; font-size: 15px; }
  .name-row input { flex: 1 1 0; min-width: 0; width: 100%; height: 50px; padding: 0 14px; border: 2.5px solid var(--ink); border-radius: var(--r-md); background: #fff; font-size: 18px; }

  .note { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .msg { padding: 10px 12px; border-radius: var(--r-md); font-weight: 600; font-size: 15px; margin-bottom: 14px; background: var(--kumkum); color: #fff; }

  details.howto { margin-top: 24px; background: rgba(255, 248, 231, .55); border: 2.5px dashed var(--ink); border-radius: var(--r-lg); padding: 4px 16px; }
  details.howto summary { padding: 12px 0; font-weight: 700; font-size: 18px; cursor: pointer; }

  .center { text-align: center; }

  .done-note { color: #8FE3D2; font-weight: 600; font-size: 15px; margin-bottom: 16px; }

  .card { border-radius: 26px; border: 3px solid var(--jasmine); padding: 26px 18px; margin-bottom: 26px; text-align: center; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  .card.covered { background-color: var(--jasmine); color: var(--ink); background-image: radial-gradient(circle, rgba(34, 19, 56, .18) 2px, transparent 2.6px); background-size: 26px 26px; }

  .place {

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

      h("p", { text: ui.timeUp ? t("voteTimeUp") : "" }), h("p", { text: need === 1 ? t("voteHint1") : t("voteHint2") })));
    const grid = h("div", { class: "grid", role: "group" });
    game.names.forEach((nm, i) => grid.appendChild(h("button", { class: "target", type: "button", "aria-pressed": String(ui.votes.indexOf(i) !== -1),
      onclick: () => {
        const at = ui.votes.indexOf(i);
        if (at !== -1) ui.votes.splice(at, 1); else { ui.votes.push(i); if (ui.votes.length > need) ui.votes.shift(); }
        rerender();
      } }, nm)));
    v.appendChild(h("section", { class: "panel" }, grid));
    v.appendChild(h("button", { class: "btn danger", type: "button", disabled: ui.votes.length !== need, onclick: () => {
      const caught = ui.votes.filter(isSpy).length;
      game.result = { type: caught === need ? "caught" : caught > 0 ? "partial" : "wrong", accused: ui.votes.slice() };
      pauseTimer(); go("result");
    } }, t("reveal")));
  }

  /* ---------- spy guess ---------- */
  function renderGuess(v) {
    v.appendChild(h("div", { class: "topbar" }, h("button", { class: "pill", type: "button", onclick: () => go("play") }, t("back")), langToggle()));
    v.appendChild(h("div", { class: "stage" }, h("div", { class: "emo", "aria-hidden": "true" }, "🕵️"), h("h2", { text: t("guessTitle") }), h("p", { text: t("guessHint") })));
    v.appendChild(h("section", { class: "panel" }, placesGrid(true)));
    v.appendChild(h("button", { class: "btn danger", type: "button", disabled: ui.guess == null, onclick: () => {
      if (!confirm(t("guessConfirm", { place: placeName(ui.guess) }))) return;
      game.result = { type: ui.guess === game.place ? "guessRight" : "guessWrong", guess: ui.guess };
      pauseTimer(); go("result");
    } }, t("reveal")));
  }

  /* ---------- result (built only now) ---------- */
  function renderResult(v) {
    const r = game.result, two = game.spies.length === 2;
    let cls, emo, title, sub;
    if (r.type === "caught") { cls = "crew"; emo = "🎉"; title = two ? t("res_caught2") : t("res_caught"); sub = t("res_caughtSub"); }
    else if (r.type === "partial") { cls = "spy"; emo = "🕵️"; title = t("res_partial"); sub = t("res_partialSub"); }
    else if (r.type === "wrong") { cls = "spy"; emo = "🕵️"; title = two ? t("res_wrong2") : t("res_wrong"); sub = t("res_wrongSub"); }
    else if (r.type === "guessRight") { cls = "spy"; emo = "🎯"; title = t("res_guessRight"); sub = t("res_guessRightSub"); }
    else { cls = "crew"; emo = "🎉"; title = t("res_guessWrong"); sub = t("res_guessWrongSub", { place: placeName(r.guess) }); }
    v.appendChild(h("div", { class: "topbar" }, h("span"), langToggle()));
    v.appendChild(h("div", { class: "hero-res " + cls }, h("div", { class: "emo", "aria-hidden": "true" }, emo), h("h2", { text: title }), h("p", { text: sub })));
    const list = h("ul", { class: "plist" });
    game.names.forEach((nm, i) => list.appendChild(h("li", { class: isSpy(i) ? "spy" : null },
      h("b", null, nm), h("span", null, isSpy(i) ? "🕵️ " + t("spyLabel") : placeRole(game.place, game.roles[i])))));
    v.appendChild(h("section", { class: "panel" },
      h("div", { class: "reveal-place" }, h("p", { class: "label", text: t("thePlace") }), h("div", { class: "name", text: PLACES[game.place][1] + " " + placeName(game.place) })),
      r.accused ? h("p", { class: "hint center", style: "margin-top:6px", text: t("accused", { names: r.accused.map(i => game.names[i]).join(", ") }) }) : null,
      h("div", { class: "divider" }),
      h("h2", { text: t("whoWasWho"), style: "font-size:20px;margin-bottom:10px" }),
      list));
    v.appendChild(h("button", { class: "btn primary", type: "button", onclick: () => newGame(game.names) }, t("again")));
    v.appendChild(h("button", { class: "btn", type: "button", onclick: () => { game = null; go("setup"); } }, t("settings")));
  }

  const SCREENS = { setup: renderSetup, handoff: renderHandoff, reveal: renderReveal, play: renderPlay, vote: renderVote, guess: renderGuess, result: renderResult };
  window.addEventListener("beforeunload", e => { if (game && !game.result) { e.preventDefault(); e.returnValue = ""; } });
  window.__secretPlace = { places: PLACES.length, roleCheck: PLACES.every(p => p[4].length === p[5].length) };
  go("setup");
})();
</script>
